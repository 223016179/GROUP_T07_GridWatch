<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GridWatch — Vendor Pathway Risk Console</title>
<style>
  :root{
    --bg:#0c1116; --panel:#141b22; --panel-2:#1a232c; --line:#26313c;

  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;}
  .app{display:grid;grid-template-columns:220px 1fr;min-height:100vh;}
  nav{background:var(--panel);border-right:1px solid var(--line);padding:20px 0;}
  .brand{padding:0 20px 18px 20px;border-bottom:1px solid var(--line);margin-bottom:10px;}
  .brand .name{font-weight:600;font-size:15px;letter-spacing:0.2px;}
  .brand .sub{color:var(--muted);font-size:11.5px;margin-top:3px;font-family:var(--mono);}
  .navitem{padding:10px 20px;color:var(--muted);cursor:pointer;font-size:13px;border-left:2px solid transparent;}
  .navitem:hover{color:var(--text);}
  .navitem.active{color:var(--text);border-left-color:var(--accent);background:var(--panel-2);}
  main{padding:26px 34px;max-width:1180px;}
  h1{font-size:19px;font-weight:600;margin:0 0 4px 0;}
  .pagesub{color:var(--muted);font-size:12.5px;margin-bottom:22px;}
  .grid{display:grid;gap:14px;}
  .cols-4{grid-template-columns:repeat(4,1fr);}
  .cols-3{grid-template-columns:repeat(3,1fr);}
  .cols-2{grid-template-columns:1fr 1fr;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px;}
  .stat .label{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:0.4px;}
  .stat .value{font-family:var(--mono);font-size:24px;margin-top:6px;font-weight:600;}
  .stat .note{color:var(--muted);font-size:11.5px;margin-top:4px;}
  section{margin-bottom:26px;}
  section > h2{font-size:14px;font-weight:600;margin:0 0 10px 0;color:var(--text);}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;color:var(--muted);font-weight:500;padding:6px 10px;border-bottom:1px solid var(--line);font-size:11px;text-transform:uppercase;letter-spacing:0.3px;}
  td{padding:7px 10px;border-bottom:1px solid var(--line);font-family:var(--mono);}
  tr:hover td{background:var(--panel-2);}
  .badge{display:inline-block;padding:2px 8px;border-radius:3px;font-size:11px;font-family:var(--mono);font-weight:600;}
  .badge.crit{background:rgba(225,90,90,0.18);color:var(--crit);}
  .badge.high{background:rgba(232,161,61,0.18);color:var(--high);}
  .badge.med{background:rgba(224,194,61,0.16);color:var(--med);}
  .badge.low{background:rgba(90,169,225,0.16);color:var(--low);}
  .badge.ok{background:rgba(79,174,130,0.16);color:var(--ok);}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .bar-label{width:170px;font-size:12px;color:var(--muted);font-family:var(--mono);flex-shrink:0;}
  .bar-track{flex:1;background:var(--panel-2);border-radius:3px;height:16px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:3px;}
  .bar-val{width:44px;text-align:right;font-family:var(--mono);font-size:12px;color:var(--text);}
  .timeline-item{display:grid;grid-template-columns:150px 90px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
  .timeline-item .ts{font-family:var(--mono);color:var(--muted);}
  .timeline-item .src{font-family:var(--mono);font-size:11px;text-transform:uppercase;}
  .src.vendor_auth{color:var(--low);} .src.edr_telemetry{color:var(--high);} .src.ot_ids_historian{color:var(--crit);}
  .pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .pill{background:var(--panel-2);border:1px solid var(--line);color:var(--muted);font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:3px;}
  .verdict{border-left:3px solid var(--crit);background:rgba(225,90,90,0.07);padding:12px 16px;border-radius:0 6px 6px 0;}
  .verdict .conf{font-family:var(--mono);color:var(--crit);font-weight:600;}
  .adv-case{padding:10px 0;border-bottom:1px solid var(--line);}
  .adv-case .name{font-size:13px;margin-bottom:6px;}
  .adv-scores{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;}
  .arrow{color:var(--muted);}
  .page{display:none;} .page.active{display:block;}
  .intel-doc{border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:10px;background:var(--panel-2);}
  .intel-doc .id{font-family:var(--mono);color:var(--accent);font-size:12.5px;margin-bottom:6px;}
  .footnote{color:var(--muted);font-size:11.5px;margin-top:8px;line-height:1.5;}
</style>
</head>

function fmtTs(ts){ return ts.replace('T',' ').slice(0,16); }
function riskBadge(score){
  if(score >= 0.9) return '<span class="badge crit">'+score.toFixed(3)+'</span>';
  if(score >= 0.5) return '<span class="badge high">'+score.toFixed(3)+'</span>';
  if(score >= 0.2) return '<span class="badge med">'+score.toFixed(3)+'</span>';
  return '<span class="badge low">'+score.toFixed(3)+'</span>';
}

        <div class="footnote" style="margin-top:8px">${e.indicators.join(' · ')}</div>
      </div>`).join('');
    const links = nlp.case_to_intelligence_links.map(l => `
      <div class="timeline-item" style="grid-template-columns:1fr 1fr 100px">
        <div>${l.case_evidence.replace(/_/g,' ')}</div>
        <div style="color:var(--muted)">${l.matched_intel_indicator}</div>
        <div class="src edr_telemetry">${l.source_advisories.join(', ')}</div>
      </div>`).join('');
    return `
      <h1>Threat intelligence</h1>
      <div class="pagesub">${nlp.corpus_size} synthetic advisory documents mined for ATT&amp;CK-for-ICS tactics and indicators</div>
      <div class="grid cols-2">
        <section><h2>Advisory corpus</h2>${docs}</section>
        <section>
          <h2>Case evidence ↔ intelligence links</h2>
          <div class="card">${links}</div>
          <h2 style="margin-top:18px">Limitations</h2>
          <div class="card"><ul style="margin:0;padding-left:18px;font-size:12.5px;color:var(--muted);line-height:1.7">${nlp.limitations.map(l=>`<li>${l}</li>`).join('')}</ul></div>
        </section>
      </div>
    `;
  },

  adversarial: () => {
    const pa = DATA.predictive_adversarial_results;
    const cases = pa.adversarial_cases.map(c => `
      <div class="adv-case">
        <div class="name">${c.case}</div>
        <div class="adv-scores">
          <span>original: ${riskBadge(c.original_score)}</span>
          <span class="arrow">→</span>
          <span>after evasion: ${riskBadge(c.evasion_score)}</span>
          ${c.evaded_at_alert_threshold ? '<span class="badge crit">EVADED ALERT THRESHOLD</span>' : '<span class="badge ok">still detected</span>'}
        </div>
      </div>`).join('');
    const gov = pa.governance_and_drift_controls.map(g=>`<li style="margin-bottom:6px">${g}</li>`).join('');
    return `
      <h1>Adversarial &amp; predictive testing</h1>
      <div class="pagesub">Alert threshold ${pa.alert_threshold} · ${pa.sessions_at_or_above_threshold} sessions currently at/above threshold</div>
      <section><h2>Evasion cases (${pa.n_of_cases_evading_detection} succeeded)</h2><div class="card">${cases}</div></section>
      <section><h2>Governance &amp; drift controls</h2><div class="card"><ul style="margin:0;padding-left:18px;font-size:13px;line-height:1.7">${gov}</ul></div></section>
    `;
  },

  qa: () => {
    const rows = DATA.test_log.map(t => `
      <tr><td>${t.test_id}</td><td>${t.component}</td><td>${t.input_condition}</td>
      <td>${t.expected_result}</td><td>${t.actual_result}</td>
      <td>${t.status==='PASS' ? '<span class="badge ok">PASS</span>' : '<span class="badge crit">FAIL</span>'}</td></tr>`).join('');
    const passCount = DATA.test_log.filter(t=>t.status==='PASS').length;
    return `
      <h1>Test log</h1>
      <div class="pagesub">${passCount}/${DATA.test_log.length} automated checks passing across all modules</div>
      <table><thead><tr><th>ID</th><th>Component</th><th>Condition</th><th>Expected</th><th>Actual</th><th>Status</th></tr></thead>
      <tbody>${rows}</tbody></table>
    `;
  },
};

function render(page){
  document.querySelectorAll('.navitem').forEach(n => n.classList.toggle('active', n.dataset.page===page));
  document.getElementById('main').innerHTML = pages[page]();
}

document.querySelectorAll('.navitem').forEach(n => {
  n.addEventListener('click', () => { if(DATA) render(n.dataset.page); });
});

render('overview');
</script>
</body>
</html>
